name: Seed slot A package

on:
  push:
    paths:
      - '.github/workflows/seed-slot-a.yml'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted package artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-4988-81f5-ae03-45b3088061d2/raw?se=2026-09-03T13%3A43%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=f3f61643-7758-55af-803f-0cece57da47d&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T11%3A30%3A26Z&ske=2026-09-04T11%3A30%3A26Z&sks=b&skv=2026-02-06&sig=/DY%2BlVo7JO2vVFFm6G16moJltKdyT4SBeJJprhwqvx4%3D' -o /tmp/public-playtest-package.zip

      - name: Materialize slot A
        shell: bash
        run: |
          set -euo pipefail
          rm -rf A
          mkdir -p A
          unzip -q /tmp/public-playtest-package.zip -d A
          rm -f .github/workflows/seed-slot-a.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add A .github/workflows/seed-slot-a.yml
          git commit -m "chore: materialize slot A package"
          git push
